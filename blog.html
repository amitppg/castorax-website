<h2>Castor Oil in Foam Manufacturing: A Growing Market</h2>
<p>The polyurethane foam industry represents one of the largest consumers of castor oil derivatives, particularly in India where the flexible and rigid foam market is estimated at ₹12,000–15,000 crores. Castor oil serves as a crucial polyol component in polyurethane production, offering superior properties compared to petroleum-based alternatives. The hydroxyl-rich ricinoleic acid (comprising 90% of castor oil's fatty acid profile) enables exceptional cross-linking in foam formulations.</p>
<p>Manufacturers utilize castor oil polyols in flexible foam for mattresses, automotive seating, and furniture applications, where the market size has grown at a CAGR of 8–10% over the past five years. Rigid foam applications in construction, refrigeration, and insulation panels have witnessed even stronger growth at 12–14% annually.</p>

<p>At Simmi Enterprises (Castorax), we have been supplying certified castor oil and medicinal oils since 1998. This guide will help you understand the key differences between USP, BP, and IP standards and how to choose the right certification for your needs.</p>
<h2>What Are Pharmacopoeial Standards?</h2>
<p>Pharmacopoeias are official compendia that establish quality standards for pharmaceutical ingredients, excipients, and finished products. The three major standards you will encounter when sourcing medicinal oils are:</p>
<ul>
<li><strong>USP (United States Pharmacopeia):</strong> The official standard in the United States</li>
<li><strong>BP (British Pharmacopoeia):</strong> The official standard in the UK and Commonwealth countries</li>
<li><strong>IP (Indian Pharmacopoeia):</strong> The official standard in India</li>
</ul>
<h2>USP (United States Pharmacopeia) Standards</h2>
<p>The United States Pharmacopeia is published by the USP Convention, a non-governmental organization established in 1820. USP standards are recognised and enforced by the U.S. Food and Drug Administration (FDA) and are considered among the most stringent pharmaceutical standards globally.</p>
<ul>
<li><strong>Stringent Testing:</strong> Extensive testing for heavy metals, residual solvents, microbial contamination</li>
<li><strong>Global Recognition:</strong> Accepted in over 140 countries</li>
<li><strong>Regular Updates:</strong> Published annually with continuous revisions</li>
</ul>
<h2>BP (British Pharmacopoeia) Standards</h2>
<p>The British Pharmacopoeia is published under the Medicines and Healthcare products Regulatory Agency (MHRA). The BP works closely with the European Pharmacopoeia (Ph.Eur.) to harmonise standards, making it essential for UK, European, and Commonwealth market access.</p>
<h2>IP (Indian Pharmacopoeia) Standards</h2>
<p>The Indian Pharmacopoeia is published by the Indian Pharmacopoeia Commission under the Ministry of Health and Family Welfare. It is mandatory for all pharmaceutical products manufactured, sold, or distributed in India under the Drugs and Cosmetics Act, 1940.</p>
<h2>Choosing the Right Standard</h2>
<table>

<p>Used for centuries in traditional farming, neem oil is now globally recognised as an eco-friendly crop protection tool that improves plant health while protecting the environment.</p>
<h2>What is Neem Oil?</h2>
<p>Neem oil is extracted from the seeds of the neem tree, native to India and widely grown in tropical regions. It contains active compounds such as Azadirachtin, which acts as a natural insect repellent, growth regulator, and anti-feedant. Unlike synthetic chemicals, neem oil works biologically — disrupting pest life cycles without harming beneficial organisms when used properly.</p>
<h2>Why Farmers Prefer Neem Oil</h2>
<ul>
<li>Eco-friendly and biodegradable</li>
<li>Safer for beneficial insects like bees when applied correctly</li>
<li>Compatible with organic farming systems</li>
<li>Non-toxic to soil health</li>
<li>Cost-effective compared to repeated chemical spraying</li>

<h2>Major Uses of Neem Oil in Farming</h2>
<h3>1. Natural Insecticide</h3>
<p>Neem oil controls over 200 types of insects including aphids, whiteflies, thrips, mealybugs, caterpillars, leaf miners, and mites. It works by repelling insects, preventing feeding, interrupting reproduction, and inhibiting larval development.</p>
<h3>2. Fungal Disease Control</h3>
<p>Neem oil is effective against common plant diseases including powdery mildew, black spot, rust, and anthracnose. Its antifungal properties make it a valuable tool in organic farming systems.</p>
<h3>3. Soil Health Improvement</h3>
<p>When used as a soil drench, neem oil helps control soil-borne pests and improves beneficial microbial activity in the soil ecosystem, contributing to long-term farm productivity.</p>

        "@context": "https://schema.org", "@type": "Blog",
        "name": "Castorax Blog", "url": baseUrl,
        "description": "Expert insights on pharmaceutical grade castor oil, medicinal oils, and industry trends.",
        "publisher": { "@type": "Organization", "name": "Simmi Enterprises", "url": "https://castorax.com" }
    };
    document.getElementById('schema-org').textContent = JSON.stringify(blogSchema, null, 2);
}

// ══════════════════════════════════════════════════════════════════════
// UI FUNCTIONS
// ══════════════════════════════════════════════════════════════════════
function generateBlogGrid() {
    const grid = document.getElementById('blogGrid');
    grid.innerHTML = blogPosts.map(post => `
        <div class="blog-card" onclick="showPost('${post.id}')">
            <div class="blog-image">${post.image}</div>
            <div class="blog-content">
                <span class="blog-category">${post.category}</span>
                <div class="blog-date">📅 ${post.date}</div>
                <h3>${post.title}</h3>
                <p class="blog-excerpt">${post.excerpt}</p>
                <a href="#" class="read-more" onclick="showPost('${post.id}');return false;">Read More →</a>
            </div>
        </div>
    `).join('');
}

function showPost(postId) {
    const post = blogPosts.find(p => p.id === postId);
    if (!post) return;

    updateSEO(post);

    const postUrl = 'https://castorax.com/blog.html?post=' + postId;
    const shareText = encodeURIComponent(post.title + ' | Castorax Blog');
    const shareUrl = encodeURIComponent(postUrl);

    document.getElementById('breadcrumb-title').textContent = post.title.substring(0, 50) + '...';

    document.getElementById('postContent').innerHTML = `
        <a href="#" onclick="showPage('blog');return false;" class="back-btn">← Back to Blog</a>
        <span class="blog-category">${post.category}</span>
        <h1>${post.title}</h1>
        <div class="post-meta">
            <span>📅 ${post.date}</span>
            <span>✍️ Simmi Enterprises (Castorax)</span>
            <span>⏱️ 5 min read</span>
        </div>
        <div class="post-content">${post.content}</div>
        <div class="share-section">
            <h3>Found This Useful? Share It</h3>
            <div class="share-buttons">
                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}" target="_blank" rel="noopener" class="share-btn share-linkedin">📘 LinkedIn</a>
                <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" rel="noopener" class="share-btn share-whatsapp">💬 WhatsApp</a>
                <a href="mailto:?subject=${shareText}&body=Check out this article: ${postUrl}" class="share-btn share-email">📧 Email</a>
                <button onclick="copyLink('${postUrl}')" class="share-btn copy-link">🔗 Copy Link</button>
            </div>
            <p style="margin-top:1.5rem;color:#666;font-size:.9rem;" id="copyMessage"></p>
        </div>
        <div class="cta-box">
            <h3>Need Pharmaceutical Grade Castor Oil?</h3>
            <p>Contact Simmi Enterprises (Castorax) — trusted supplier since 1998. COA with every batch.</p>
            <a href="https://castorax.com#quote">Request Quote →</a>
        </div>
    `;

    showPage('post');
    window.scrollTo(0, 0);
    if (history.pushState) history.pushState(null, null, '?post=' + postId);
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (pageId === 'blog') {
        resetSEO();
        if (history.pushState) history.pushState(null, null, 'blog.html');
    }
}

function copyLink(url) {
    navigator.clipboard.writeText(url).then(() => {
        document.getElementById('copyMessage').textContent = '✓ Link copied to clipboard!';
        setTimeout(() => { document.getElementById('copyMessage').textContent = ''; }, 3000);
    });
}

window.addEventListener('load', function() {
    generateBlogGrid();
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post');
    if (postId) showPost(postId);
});

window.addEventListener('popstate', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post');
    if (postId) { showPost(postId); }
    else { showPage('blog'); }
});
</script>
</body>
</html>
